[package]
name = "soroban-identity-contracts"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = [
    ".",
    "shared-errors",
    "identity-registry",
    "credential-manager",
    "reputation",
    "soroban-identity-interface",
    "schema-registry",
    "revocation-registry",
    "selective-disclosure",
]
default-members = [
    ".",
    "shared-errors",
    "identity-registry",
    "credential-manager",
    "reputation",
    "soroban-identity-interface",
    "schema-registry",
    "revocation-registry",
    "selective-disclosure",
]
resolver = "2"

[dev-dependencies]
credential-manager = { path = "credential-manager" }
identity-registry = { path = "identity-registry" }
reputation = { path = "reputation" }
shared-errors = { path = "shared-errors" }
soroban-identity-interface = { path = "soroban-identity-interface" }
schema-registry = { path = "schema-registry" }
revocation-registry = { path = "revocation-registry" }
selective-disclosure = { path = "selective-disclosure" }
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
