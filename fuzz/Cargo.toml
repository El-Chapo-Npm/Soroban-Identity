[package]
name = "soroban-identity-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

# cargo-fuzz requires the workspace to be declared here so it is isolated
[workspace]
members = ["."]

# cargo-fuzz validates this marker before it will build or run a target. Keep
# it here because this manifest intentionally lives in its own workspace.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3", features = ["derive"] }
# derive_arbitrary is pinned to keep it aligned with arbitrary 1.3.x. Without
# this explicit pin, cargo resolves derive_arbitrary to 1.4.x (the highest
# semver-compatible version for `version = "1"` in arbitrary's own Cargo.toml),
# but derive_arbitrary 1.4.0 introduced `arbitrary::details` and `try_size_hint`
# that do not exist in arbitrary 1.3.x — the mismatch produces a compile error.
# arbitrary 1.3.2 is itself pinned by soroban-env-common, so we must keep
# derive_arbitrary in the same minor series.
derive_arbitrary = "=1.3.2"
# Keep the Soroban host graph on the current ethnum release; older releases
# use an invalid transmute rejected by recent nightly compilers.
ethnum = "=1.5.3"
# Keep the testutils crypto graph on rand_core 0.6, as required by Soroban
# 21.x; the host accepts this version and avoids selecting ed25519-dalek 3.x.
ed25519-dalek = "=2.2.0"
# Pin to the SDK used by shared-events. Without this exact pin, the isolated
# fuzz workspace can select an SDK version incompatible with that path crate.
soroban-sdk = { version = "=21.7.3", features = ["testutils"] }
identity-registry = { path = "../contracts/identity-registry", features = ["testutils"] }
credential-manager = { path = "../contracts/credential-manager", features = ["testutils"] }
reputation = { path = "../contracts/reputation", features = ["testutils"] }
did-bridge = { path = "../contracts/bridge", features = ["testutils"] }

[[bin]]
name = "fuzz_create_did"
path = "fuzz_targets/fuzz_create_did.rs"
test = false
doc = false

[[bin]]
name = "fuzz_issue_credential"
path = "fuzz_targets/fuzz_issue_credential.rs"
test = false
doc = false

[[bin]]
name = "fuzz_submit_score"
path = "fuzz_targets/fuzz_submit_score.rs"
test = false
doc = false

[[bin]]
name = "fuzz_verify_credentials_batch"
path = "fuzz_targets/fuzz_verify_credentials_batch.rs"
test = false
doc = false

[[bin]]
name = "fuzz_revoke_and_delegate"
path = "fuzz_targets/fuzz_revoke_and_delegate.rs"
test = false
doc = false

[[bin]]
name = "fuzz_resolve_external_did"
path = "fuzz_targets/fuzz_resolve_external_did.rs"
test = false
doc = false

[profile.release]
# Fuzzing requires debug info for useful stack traces
opt-level = 3
debug = true
