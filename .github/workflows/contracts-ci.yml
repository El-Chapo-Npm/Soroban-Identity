name: Contracts CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  contract-tests:
    name: Soroban Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run contract tests
        run: cargo test --workspace

      - name: Run clippy
        working-directory: contracts
        run: cargo clippy --all-targets --all-features -- -D warnings

  format:
    name: Rustfmt Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Cache Rust toolchain and Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: contracts
        run: cargo fmt --check

  build-and-test:
    name: Build & Test Soroban Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust toolchain and Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build all contracts (wasm32)
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Test identity-registry
        working-directory: contracts/identity-registry
        run: cargo test

      - name: Test governance
        working-directory: contracts/governance
        run: cargo test

      - name: Test credential-manager
        working-directory: contracts/credential-manager
        run: cargo test

      - name: Test reputation
        working-directory: contracts/reputation
        run: cargo test

      - name: Check WASM size budgets
        run: |
          chmod +x scripts/check_wasm_size.sh
          scripts/check_wasm_size.sh
        env:
          IDENTITY_REGISTRY_SIZE_BUDGET: ${{ env.IDENTITY_REGISTRY_SIZE_BUDGET }}
          CREDENTIAL_MANAGER_SIZE_BUDGET: ${{ env.CREDENTIAL_MANAGER_SIZE_BUDGET }}
          REPUTATION_SIZE_BUDGET: ${{ env.REPUTATION_SIZE_BUDGET }}

  post-deployment-health-check:
    name: Post-deployment Health Check
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployed contracts through server health endpoint
        env:
          SERVER_HEALTH_URL: ${{ secrets.SERVER_HEALTH_URL }}
        run: scripts/post_deploy_health_check.sh
