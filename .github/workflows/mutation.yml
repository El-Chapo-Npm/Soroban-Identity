name: Mutation Testing

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      package:
        description: "Optional crate to mutate (e.g. identity-registry)"
        required: false

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Run mutation tests
        run: ./tests/mutation/run-mutation.sh ${{ inputs.package && format('-p {0}', inputs.package) || '' }}
      - name: Job summary
        if: always()
        run: cat tests/mutation/reports/mutation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: tests/mutation/reports
