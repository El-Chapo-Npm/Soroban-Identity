# Microservices deployment on Linkerd (issue #1110).
# Linkerd injects sidecars that provide automatic mTLS (service-to-service
# encryption), retries/timeouts, and per-route metrics.
apiVersion: v1
kind: Namespace
metadata:
  name: soroban-identity
  annotations:
    linkerd.io/inject: enabled
    config.linkerd.io/trace-collector: jaeger.observability:55678
---
apiVersion: v1
kind: Secret
metadata:
  name: inter-service-auth
  namespace: soroban-identity
type: Opaque
stringData:
  SERVICE_AUTH_SECRET: change-me
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: identity-service, namespace: soroban-identity, labels: { app: identity-service } }
spec:
  replicas: 2
  selector: { matchLabels: { app: identity-service } }
  template:
    metadata: { labels: { app: identity-service } }
    spec:
      containers:
        - name: identity-service
          image: ghcr.io/el-chapo-npm/soroban-identity-server:latest
          env: [{ name: SERVICE_NAME, value: identity-service }]
          envFrom: [{ secretRef: { name: inter-service-auth } }]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: 8080 } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: credential-service, namespace: soroban-identity, labels: { app: credential-service } }
spec:
  replicas: 3
  selector: { matchLabels: { app: credential-service } }
  template:
    metadata: { labels: { app: credential-service } }
    spec:
      containers:
        - name: credential-service
          image: ghcr.io/el-chapo-npm/soroban-identity-server:latest
          env: [{ name: SERVICE_NAME, value: credential-service }]
          envFrom: [{ secretRef: { name: inter-service-auth } }]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: 8080 } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: reputation-service, namespace: soroban-identity, labels: { app: reputation-service } }
spec:
  replicas: 2
  selector: { matchLabels: { app: reputation-service } }
  template:
    metadata: { labels: { app: reputation-service } }
    spec:
      containers:
        - name: reputation-service
          image: ghcr.io/el-chapo-npm/soroban-identity-server:latest
          env: [{ name: SERVICE_NAME, value: reputation-service }]
          envFrom: [{ secretRef: { name: inter-service-auth } }]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: 8080 } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notification-service, namespace: soroban-identity, labels: { app: notification-service } }
spec:
  replicas: 1
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata: { labels: { app: notification-service } }
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/el-chapo-npm/soroban-identity-server:latest
          env: [{ name: SERVICE_NAME, value: notification-service }]
          envFrom: [{ secretRef: { name: inter-service-auth } }]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: 8080 } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: soroban-identity, labels: { app: api-gateway } }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/el-chapo-npm/soroban-identity-server:latest
          env:
            - { name: SERVICE_NAME, value: api-gateway }
            - { name: CONSUL_HTTP_ADDR, value: "http://consul-server.consul:8500" }
          envFrom: [{ secretRef: { name: inter-service-auth } }]
          ports: [{ containerPort: 8080 }]
---
# Services (one per deployment)
apiVersion: v1
kind: Service
metadata: { name: identity-service, namespace: soroban-identity }
spec: { selector: { app: identity-service }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: v1
kind: Service
metadata: { name: credential-service, namespace: soroban-identity }
spec: { selector: { app: credential-service }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: v1
kind: Service
metadata: { name: reputation-service, namespace: soroban-identity }
spec: { selector: { app: reputation-service }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: v1
kind: Service
metadata: { name: notification-service, namespace: soroban-identity }
spec: { selector: { app: notification-service }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: soroban-identity }
spec: { type: LoadBalancer, selector: { app: api-gateway }, ports: [{ port: 443, targetPort: 8080 }] }
---
# Only the gateway and peer services may talk to backend services (mesh-level authz on top of mTLS).
apiVersion: policy.linkerd.io/v1beta1
kind: Server
metadata: { name: backend-http, namespace: soroban-identity }
spec:
  podSelector:
    matchExpressions: [{ key: app, operator: In, values: [identity-service, credential-service, reputation-service, notification-service] }]
  port: 8080
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata: { name: in-namespace, namespace: soroban-identity }
spec:
  identities: ["*.soroban-identity.serviceaccount.identity.linkerd.cluster.local"]
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata: { name: backend-mtls-only, namespace: soroban-identity }
spec:
  targetRef: { group: policy.linkerd.io, kind: Server, name: backend-http }
  requiredAuthenticationRefs:
    - { group: policy.linkerd.io, kind: MeshTLSAuthentication, name: in-namespace }
